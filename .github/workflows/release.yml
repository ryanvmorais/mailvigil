# Release pipeline: builds the sdist and the wheel once, then publishes that exact build to PyPI
# with Trusted Publishing (OIDC): no token is stored anywhere. Only the maintainer starts it.
# Procedure and one-time setup: docs/releasing.md.
#
#   release (published)   build -> publish to pypi.org   (environment `pypi`, needs an approval)
#   workflow_dispatch     build -> publish to test.pypi.org (environment `testpypi`), the dry run
#
# Actions are pinned by commit SHA, with the version in the comment: a tag can be moved after
# publication, a SHA cannot. `pypa/gh-action-pypi-publish@release/v1` is a branch, so the SHA of a
# release is used instead. Dependabot (github-actions) updates the SHA and the comment together.
name: Release

on:
  release:
    types: [published]
  # The dry run: TestPyPI only, never pypi.org.
  workflow_dispatch:

# Read-only by default; the publish jobs ask for `id-token` themselves.
permissions:
  contents: read

# One release at a time, and a run that is already publishing is never cancelled halfway.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      # A tag that disagrees with pyproject.toml would publish a version nobody tagged.
      - name: The tag matches the version in pyproject.toml
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::the tag $TAG does not match version $version in pyproject.toml"
            exit 1
          fi

      - name: Build the sdist and the wheel
        run: uv build

      # The same checks as the CI `package` job, repeated here so the release never depends on
      # remembering that a green pull request ran them.
      - name: The metadata renders on PyPI
        run: uvx --exclude-newer "7 days" twine check --strict dist/*

      - name: The wheel declares no runtime dependency
        run: |
          if unzip -p dist/*.whl '*.dist-info/METADATA' | grep -E '^Requires-Dist:'; then
            echo "::error::the wheel declares a runtime dependency; MailVigil must stay dependency-free"
            exit 1
          fi

      - name: The wheel installs in a clean environment and runs
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean" dist/*.whl
          "$RUNNER_TEMP/clean/bin/mailvigil" --version

      - name: Keep the build for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI (dry run)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/mailvigil/
    permissions:
      # The OIDC token PyPI exchanges for a short-lived upload credential.
      id-token: write
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # The environment holds the required reviewer: the job waits for the maintainer's approval,
    # the point of no return (PyPI never accepts the same version twice).
    environment:
      name: pypi
      url: https://pypi.org/project/mailvigil/
    permissions:
      id-token: write
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
