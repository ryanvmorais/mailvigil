# Issue form configuration — consumed by GitHub.
# No blank issues: the two forms cover bugs and features. Vulnerabilities go private. The link
# works once Private Vulnerability Reporting is on, which happens when the repository goes public
# (it is unavailable while it is private on the Free plan).
blank_issues_enabled: false
contact_links:
  - name: "Report a vulnerability in MailVigil"
    url: "https://github.com/ryanvmorais/mailvigil/security/advisories/new"
    about: "Private reporting through GitHub Security Advisories. See SECURITY.md."
