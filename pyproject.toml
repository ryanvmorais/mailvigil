# =============================================================================
# Project configuration (PEP 621) — built with Hatchling, managed with uv.
#
#   [project]                        metadata (no runtime dependencies, by design)
#   [dependency-groups] dev          lint / type / test tooling (installed by default)
#   [tool.*]                         config for ruff, black, mypy, coverage, pytest
#
# Exact versions of the whole graph are pinned in uv.lock (`uv lock`); the lines
# below are lower-bound floors only.
# =============================================================================

[project]
name = "mailvigil"
version = "1.1.0"
description = "Reads DMARC aggregate reports and tells you, in plain language, if it is safe to move to p=reject."
readme = "README.md"
# 3.12 is the floor so that anyone still on it can install the tool; 3.12 reaches end of life on
# 2028-10-31, review then. CI tests the floor and the newest stable release.
requires-python = ">=3.12"
# SPDX expression (PEP 639); it replaces the table form and the `License ::` classifier.
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Morais" }]
keywords = [
    "dmarc",
    "dmarc-reports",
    "rua",
    "email",
    "email-security",
    "spf",
    "dkim",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Communications :: Email",
    "Topic :: Security",
    "Typing :: Typed",
]
# Zero runtime dependencies is the product promise: the whole tool runs on the standard library.
dependencies = []

[project.scripts]
mailvigil = "mailvigil.cli:main"

[project.urls]
Homepage = "https://github.com/ryanvmorais/mailvigil"
Repository = "https://github.com/ryanvmorais/mailvigil"
Issues = "https://github.com/ryanvmorais/mailvigil/issues"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

# --- Packaging (Hatchling) ---------------------------------------------------
[build-system]
# 1.27 is the first Hatchling that writes PEP 639 license metadata.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailvigil"]

# The source distribution is the package plus what a packager needs to read the project. The
# tests, the specs, the CI and the local caches live in the repository only.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

# --- Lint (ruff: replaces flake8 + isort, reads pyproject natively) ----------
[tool.ruff]
line-length = 100
# The lint target is the floor, so syntax newer than 3.12 fails here instead of on a user's machine.
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, flake8-simplify,
# flake8-comprehensions, ruff-native, flake8-bandit (security).
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# The names say "password", the values are never one: an enum member, a message key.
"src/mailvigil/fetch/errors.py" = ["S105"]  # FetchReason members: PASSWORD_FILE, PASSWORD_UNUSABLE
"src/mailvigil/messages/*.py" = ["S106"]  # Messages fields: result_pass, password_file_exposed
# Our own hooks and demo script run fixed commands (`git`, the venv's tools, this interpreter).
".claude/hooks/*.py" = ["S603", "S607"]
"docs/demo/*.py" = ["S603"]
# Pytest: `assert` is the idiom, the secrets are invented, the subprocesses run this interpreter or
# `git` on fixtures, and the XML parsed is the repository's own synthetic reports.
"tests/**/*.py" = ["S101", "S105", "S106", "S314", "S603"]

[tool.ruff.lint.isort]
known-first-party = ["mailvigil"]

# --- Format (black) ---------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]

# --- Types (mypy, strict) --------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Type-checking covers the shipped package only; `tests/` is exercised by pytest. Strict over the
# tests reports about a hundred errors (helpers that build frozen dataclasses from `**fields`, spies
# that replace methods), none of them a bug the suite would miss. The `# type: ignore[...]` comments
# in the tests are therefore for the editor's checker (Pylance), not for mypy; keep them as they are.
files = ["src"]

# --- Coverage (pytest-cov) -------------------------------------------------
# Not part of the default `pytest` run: `uv run pytest --cov` measures it.
[tool.coverage.run]
source = ["src/mailvigil"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# --- Tests (pytest) --------------------------------------------------------
[tool.pytest.ini_options]
# -ra: summary line for every non-passing test; -q: quiet, the pre-commit prints the whole run.
addopts = "-ra -q"
testpaths = ["tests"]
# Lets tests import helpers from the repository root (tests/ is a plain directory, not installed).
pythonpath = ["."]
